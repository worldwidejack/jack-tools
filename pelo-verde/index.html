:root { --ink:#1A1512; --paper:#E8DCC2; --cream:#F6EEDC; --amber:#FFB23F; --green:#3DDC84; --magenta:#FF2E88; }
html,body { margin:0; height:100%; background:var(--ink); overflow:hidden; color:var(--cream); font-family:'Special Elite', Georgia, serif; }
#stage { position:absolute; left:0; top:0; width:1280px; height:720px; background:#000; box-shadow:0 0 0 1px #2B231D, 0 0 60px rgba(0,0,0,.8); }
#stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#gl { image-rendering:auto; }
#ui { cursor:crosshair; }
#dom { position:absolute; inset:0; pointer-events:none; }
#dom > * { pointer-events:auto; }
#loader { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:var(--ink); transition:opacity .4s; }
#loader.gone { opacity:0; pointer-events:none; }
#loader .leader { position:relative; width:220px; height:220px; border-radius:50%; border:6px solid var(--paper); display:flex; align-items:center; justify-content:center; }
#loader .leader::before { content:''; position:absolute; inset:-6px; border-radius:50%; background:conic-gradient(rgba(232,220,194,.35) 0deg, transparent 0deg); animation:sweep 1s linear infinite; }
#loader .leader::after { content:''; position:absolute; left:50%; top:-40px; bottom:-40px; width:2px; background:var(--paper); box-shadow:-150px 0 0 -0px transparent; }
#loader .num { font-family:'Limelight', Georgia, serif; font-size:120px; color:var(--paper); line-height:1; }
#loader .num::after { content:'5'; animation:count 5s steps(1) infinite; }
#loader .cap { position:absolute; bottom:12%; left:0; right:0; text-align:center; font-size:18px; letter-spacing:.2em; color:var(--amber); }
