  <style>:root{--mare:#4e6880;--carta:#fbe9cf;--bordo:#15100e;--inchiostro:#2a1a12;color-scheme:light}html,body{background:var(--mare);height:100%;color:var(--inchiostro);touch-action:none;-webkit-user-select:none;user-select:none;margin:0;overflow:hidden}canvas{width:100vw;height:100vh;display:block;position:fixed;inset:0}#aiuto{z-index:1;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px, env(safe-area-inset-left,0px));background:var(--carta);border:2.5px solid var(--bordo);pointer-events:none;opacity:.92;border-radius:12px;padding:7px 11px;font:600 13px/1.2 system-ui,sans-serif;position:fixed}#bAzione{z-index:1;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));border:3px solid var(--bordo);background:var(--carta);color:var(--inchiostro);cursor:pointer;border-radius:16px;padding:13px 20px 13px 46px;font:700 17px/1 system-ui,sans-serif;position:fixed;box-shadow:0 3px #15100e}#bAzione:before{content:"A";color:#fff;text-align:center;box-sizing:border-box;background:#b8a43a;border:2px solid #15100e;border-radius:50%;width:26px;height:26px;font:800 14px/26px system-ui,sans-serif;position:absolute;top:50%;left:10px;transform:translateY(-50%)}#bAzione:active{transform:translateY(2px);box-shadow:0 1px #15100e}button:focus-visible{outline:3px solid var(--inchiostro);outline-offset:2px}#pad{z-index:1;pointer-events:none;border:3px solid #fff6e4bf;border-radius:50%;width:92px;height:92px;margin:-46px 0 0 -46px;display:none;position:fixed}#pad i{background:#fff6e4e6;border-radius:50%;width:34px;height:34px;position:absolute;top:29px;left:29px}#velo{z-index:2;opacity:0;pointer-events:none;background:#1c1412;transition:opacity .25s;position:fixed;inset:0}#velo.su{opacity:1}#mosse{z-index:1;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));gap:8px;display:flex;position:fixed}#mosse button{border:3px solid var(--bordo);background:var(--carta);color:var(--inchiostro);cursor:pointer;border-radius:14px;padding:10px 13px;font:700 14px/1 system-ui,sans-serif;box-shadow:0 3px #15100e}#mosse button:active{transform:translateY(2px);box-shadow:0 1px #15100e}#aiuto .dito{display:none}@media (pointer:coarse),(width<=700px){#aiuto .pc{display:none}#aiuto .dito{display:inline}}#numeri{z-index:1;left:max(10px, env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));color:#fbe9cf;pointer-events:none;background:#15100e8c;border-radius:6px;padding:4px 7px;font:600 11px/1 ui-monospace,Menlo,monospace;position:fixed}</style>
