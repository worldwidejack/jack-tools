<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Porto di Marea</title>
  <style>:root{--mare:#8dd0be;--carta:#fff6e4;--bordo:#e7b7a5;--inchiostro:#5a3a24;color-scheme:light}html,body{background:var(--mare);height:100%;color:var(--inchiostro);touch-action:none;-webkit-user-select:none;user-select:none;margin:0;overflow:hidden}canvas{width:100vw;height:100vh;display:block;position:fixed;inset:0}#aiuto{z-index:1;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px, env(safe-area-inset-left,0px));background:var(--carta);border:2.5px solid var(--bordo);pointer-events:none;opacity:.92;border-radius:12px;padding:7px 11px;font:600 13px/1.2 system-ui,sans-serif;position:fixed}#bAzione{z-index:1;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));border:3px solid var(--bordo);background:var(--carta);color:var(--inchiostro);cursor:pointer;border-radius:16px;padding:13px 20px 13px 46px;font:700 17px/1 system-ui,sans-serif;position:fixed;box-shadow:0 3px #d79f8c}#bAzione:before{content:"A";color:#fff;text-align:center;box-sizing:border-box;background:#8fbf6a;border:2px solid #6f9a50;border-radius:50%;width:26px;height:26px;font:800 14px/26px system-ui,sans-serif;position:absolute;top:50%;left:10px;transform:translateY(-50%)}#bAzione:active{transform:translateY(2px);box-shadow:0 1px #d79f8c}button:focus-visible{outline:3px solid var(--inchiostro);outline-offset:2px}#pad{z-index:1;pointer-events:none;border:3px solid #fff6e4bf;border-radius:50%;width:92px;height:92px;margin:-46px 0 0 -46px;display:none;position:fixed}#pad i{background:#fff6e4e6;border-radius:50%;width:34px;height:34px;position:absolute;top:29px;left:29px}#velo{z-index:2;opacity:0;pointer-events:none;background:#fff6e4;transition:opacity .25s;position:fixed;inset:0}#velo.su{opacity:1}</style>
  <script type="module" crossorigin src="./assets/index-CpshKDJe.js"></script>
</head>
<body>
  <div id="aiuto">wasd o trascina · e per agire</div>
  <button id="bAzione" style="display:none">entra</button>
  <div id="pad"><i></i></div>
  <div id="velo"></div>
</body>
</html>
